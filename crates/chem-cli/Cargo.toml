[package]
name = "chem-cli"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Command-line cheminformatics: fingerprints, similarity search, aromaticity, 2D coordinates and depiction"

# The binary is `chem`; the package cannot be, because the `chem` name on
# crates.io is the library facade (#144). Its own crate rather than a `[[bin]]`
# on that facade: Cargo has no bin-only dependency section, so a binary living
# there would force every library consumer of `chem` to compile clap. This is
# why ripgrep ships as package `ripgrep` with binary `rg`.
[[bin]]
name = "chem"
path = "src/main.rs"

keywords = ["chemistry", "cheminformatics", "cli", "smiles", "fingerprint"]
categories = ["science", "command-line-utilities"]
documentation = "https://docs.rs/chem-cli"
readme = "../../README.md"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

bitvec = "1.0.1"
pollster = { workspace = true }

chem-core = { workspace = true }
chem-io = { workspace = true }
chem-draw = { workspace = true }
emath = { workspace = true }
chem-search = { workspace = true }

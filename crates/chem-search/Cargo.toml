description = "Fingerprint generation and similarity search across CPU and GPU backends"

keywords = ["chemistry", "cheminformatics", "similarity", "search", "gpu"]
categories = ["science"]
documentation = "https://docs.rs/chem-search"
readme = "../../README.md"

[dependencies]
anyhow = { workspace = true }
bitvec = "1.0.1"
log = { workspace = true }

chem-core = { workspace = true }

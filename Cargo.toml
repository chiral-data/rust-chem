[workspace]
members = ["chem_app","chemcore", "chemfp", "chemgpu", "chemio"]
resolver = "3"

[workspace.package]
version = "0.2.0"
license = "MIT"
repository = "https://github.com/chiral-data/rust-chem"

[workspace.dependencies]
log = "0.4.0"
nom  = "8.0.0" # Build safe Parsers
rfd = "0.16"
wgpu = "27.0.1"
egui = "0.33.3"
rayon = "1.11.0"
eframe = "0.33.3"
anyhow = "1.0"
futures = "0.3.31"
pollster = "0.4.0"
bytemuck = { version = "1.24", features = ["derive"] }
thiserror = "2.0.17"
env_logger = "0.11.8"
egui_extras = "0.33.3"

chemio = { path = "./chemio" }
chemfp = { path = "./chemfp" }
chemgpu = { path = "./chemgpu" }
chemcore = { path = "./chemcore" }


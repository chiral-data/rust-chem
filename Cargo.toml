[workspace]
members = ["chem_app","chemcore", "chemdraw", "chemfp", "chemgpu", "chemio"]
resolver = "3"

[workspace.package]
version = "0.5.0"
license = "MIT"
repository = "https://github.com/chiral-data/rust-chem"

[workspace.dependencies]
log = "0.4.0"
nom  = "8.0.0" # Build safe Parsers
rfd = "0.16"
wgpu = "27.0.1"
egui = { version = "0.33.3", features = ["persistence"] }
# egui's own geometry and colour crates, published separately. Depending on
# them directly is what lets `chemdraw` describe a depiction without a GUI;
# egui re-exports these very types, so `chem_app` needs no conversions.
emath = "0.33.3"
ecolor = "0.33.3"
rayon = "1.11.0"
eframe = { version = "0.33.3", features = ["persistence"] }
anyhow = "1.0"
futures = "0.3.31"
pollster = "0.4.0"
bytemuck = { version = "1.24", features = ["derive"] }
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
env_logger = "0.11.8"
egui_extras = "0.33.3"

chemio = { path = "./chemio" }
chemfp = { path = "./chemfp" }
chemgpu = { path = "./chemgpu" }
chemcore = { path = "./chemcore" }
chemdraw = { path = "./chemdraw" }


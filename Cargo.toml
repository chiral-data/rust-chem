[workspace]
# A glob rather than a list: this milestone adds two more crates, and a
# members list is one more place to forget.
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
license = "MIT"
repository = "https://github.com/chiral-data/rust-chem"

[workspace.dependencies]
log = "0.4.0"
nom  = "8.0.0" # Build safe Parsers
rfd = "0.16"
wgpu = "27.0.1"
egui = { version = "0.33.3", features = ["persistence"] }
# egui's own geometry and colour crates, published separately. Depending on
# them directly is what lets `chem-draw` describe a depiction without a GUI;
# egui re-exports these very types, so `chem-app` needs no conversions.
emath = "0.33.3"
ecolor = "0.33.3"
rayon = "1.11.0"
eframe = { version = "0.33.3", features = ["persistence"] }
anyhow = "1.0"
futures = "0.3.31"
pollster = "0.4.0"
bytemuck = { version = "1.24", features = ["derive"] }
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
env_logger = "0.11.8"
egui_extras = "0.33.3"

# `version` alongside `path` is what makes these publishable: cargo refuses to
# publish a crate whose dependencies carry no version requirement, and strips
# the `path` on the way to crates.io so consumers resolve from the registry.
# Locally the path still wins, so a workspace build never touches the network.
chem-io = { path = "./crates/chem-io", version = "0.5.0" }
chem-fp = { path = "./crates/chem-fp", version = "0.5.0" }
chem-gpu = { path = "./crates/chem-gpu", version = "0.5.0" }
chem-core = { path = "./crates/chem-core", version = "0.5.0" }
chem-draw = { path = "./crates/chem-draw", version = "0.5.0" }
chem-search = { path = "./crates/chem-search", version = "0.5.0" }
chem-cli = { path = "./crates/chem-cli", version = "0.5.0" }


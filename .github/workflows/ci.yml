name: Chiral Pipeline

on:
  push:
    branches: [main]
  # Milestone integration branches (v050, v060, ...) as well as main. Story
  # PRs merge into those, and until now they merged unchecked: CI ran once per
  # milestone, on its own PR into main, so a break could sit unattributed
  # behind ten merged PRs. Deliberately not added to `push`: a merge into the
  # branch would re-run the identical commit the PR just checked.
  pull_request:
    branches: [main, 'v[0-9]*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Site
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Anything aimed at main gets the full three-OS sweep. A story PR into
        # a milestone branch gets Linux only: a milestone lands ten-odd small
        # PRs, and paying for Windows and macOS on each of them is what the
        # milestone's own PR into main is for.
        #
        # The cost is that a Windows- or macOS-only break surfaces at the end
        # of the milestone rather than in the PR that caused it. chem-app has a
        # Windows-only `winit` dependency, so that isn't hypothetical - but it
        # still cannot reach main unnoticed.
        os: >-
          ${{ (github.base_ref == 'main' || github.ref_name == 'main')
          && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')
          || fromJSON('["ubuntu-latest"]') }}
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{runner.os}}-cargo-registry-${{hashFiles('**/Cargo.lock')}}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{runner.os}}-cargo-index-${{hashFiles('**/Cargo.lock')}}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{runner.os}}-cargo-build-target-${{hashFiles('**/Cargo.lock')}}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo b --verbose --all-features

      - name: Run Tests
        run: cargo t --verbose --all-features

      - name: Run doctests
        run: cargo t --doc --all-features

  minimal:
    name: Default features only
    runs-on: ubuntu-latest
    # `chem`'s default build must stay free of wgpu and clap. Nothing else
    # checks this: `--all-features` covers one of four configurations, and a
    # workspace build unifies chem-app's `gpu` into every member's view of
    # `chem`, so the lean configuration is only observable through `-p chem`.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (no default features)
        run: cargo clippy -p chem --no-default-features --all-targets -- -D warnings

      - name: Test (no default features)
        run: cargo test -p chem --no-default-features

      - name: The lean build pulls neither wgpu nor clap
        run: |
          if cargo tree -p chem --no-default-features -e normal | grep -qE 'wgpu|clap'; then
            echo "::error::the default build should not depend on wgpu or clap"
            cargo tree -p chem --no-default-features -e normal | grep -E 'wgpu|clap'
            exit 1
          fi

      # --- the crate stays pure Rust -------------------------------------------
      #
      # The milestone's central constraint: no FFI, no `*-sys` crate, no build.rs
      # invoking a C compiler, no run-time subprocess to a chemistry toolkit. It
      # was a paragraph in the tracking issue, enforced by nothing, and the risk
      # it manages is decay rather than intent — a transitive bump pulls in a C
      # dependency and the constraint is gone with a green build.
      #
      # These are not the strongest check. The `Web (WASM) Build` job is:
      # nothing needing a C compiler survives wasm32-unknown-unknown. These are
      # the *legible* one. They make the intent visible to whoever next
      # considers a -sys crate, and they fail with a sentence rather than with a
      # linker error on a target the author was not thinking about. Do not
      # delete them as redundant.
      #
      # Scoped to the lean build on purpose. `--all-features` pulls wgpu, whose
      # tree legitimately contains objc-sys, js-sys, web-sys, windows-sys and
      # friends — platform and JavaScript bindings, not bundled C. Banning those
      # would mean banning `gpu`. What must stay pure is what a consumer gets by
      # default. The toolkit rule below is the one that applies everywhere.
      - name: The lean build binds no C library
        run: |
          lean() { cargo tree -p chem --no-default-features -e "$1" --prefix none -f '{p}' | awk '{print $1}' | sort -u; }

          if lean normal | grep -qE -- '-sys$'; then
            echo "::error::a -sys crate reached the default build; the crate must need only a Rust toolchain"
            lean normal | grep -E -- '-sys$'
            exit 1
          fi

          # `links` is how a package declares it binds a native library, and is
          # the honest signal — a crate need not be named *-sys to bind one.
          cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.links != null) | .name' | sort -u > /tmp/links.txt
          if lean normal > /tmp/lean.txt && grep -Fxf /tmp/links.txt /tmp/lean.txt; then
            echo "::error::a package in the default build declares a native library (links key)"
            exit 1
          fi

          # Directly encodes "no build.rs invoking a C compiler".
          #
          # `normal,build` rather than `build`: on its own, `-e build` walks
          # only build edges *from the root*, so it reports `chem` and nothing
          # else however much C is further down. Adding a dependency on
          # libz-sys left it green while the -sys rules above both fired;
          # `normal,build` surfaces the cc, pkg-config and vcpkg underneath it.
          if lean normal,build | grep -qE '^(cc|cmake|bindgen|pkg-config)$'; then
            echo "::error::a C-toolchain build dependency reached the default build"
            lean normal,build | grep -E '^(cc|cmake|bindgen|pkg-config)$'
            exit 1
          fi

      - name: The chemistry toolkits stay oracles, never dependencies
        run: |
          # Unlike the rules above this applies at every feature set: a toolkit
          # behind an optional feature is still a toolkit in the tree.
          #
          # chemfiles is named because it is the trap — a pure-Rust-looking API
          # with C++ underneath, and exactly what someone reaches for when a
          # format looks tedious. RDKit and OpenBabel belong in tools/oracle/,
          # which drives them as subprocesses in their own image and is never
          # named in any Cargo.toml.
          if cargo tree -e normal --all-features | grep -qEi 'openbabel|rdkit|chemfiles'; then
            echo "::error::a chemistry toolkit reached the dependency graph; it belongs in tools/oracle/"
            cargo tree -e normal --all-features | grep -Ei 'openbabel|rdkit|chemfiles'
            exit 1
          fi
          if grep -rn 'Command::new' crates/*/src | grep -Ei 'obabel|rdkit|python'; then
            echo "::error::the library shells out to a chemistry toolkit at run time"
            exit 1
          fi

      - name: Packaging is publishable
        run: cargo publish -p chem --dry-run --locked --all-features

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    # Only on the way to main. It uploads with `fail_ci_if_error: false`, so it
    # can never fail a build, and it is the slowest job here - an instrumented
    # rebuild plus a cargo-llvm-cov install. A coverage delta per story PR is
    # noise; the one that matters is the milestone's.
    if: github.base_ref == 'main' || github.ref_name == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  web:
    name: Web (WASM) Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (wasm32)
        run: cargo clippy -p chem-app --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Install trunk
        uses: taiki-e/install-action@trunk

      - name: Build web bundle
        working-directory: crates/chem-app
        run: trunk build --release

  oracle:
    name: Differential oracles
    runs-on: ubuntu-latest

    # Its own job, parallel to the Rust ones, because it needs Docker and will
    # be the slowest thing in this file. A `cargo fmt` fix must not wait on
    # RDKit and OpenBabel installing.
    steps:
      - uses: actions/checkout@v4

      - name: Build the oracle image
        run: docker build -t chem-oracle -f tools/oracle/Dockerfile .

      # Fails on `chem` disagreeing with an oracle. Oracle-vs-oracle
      # disagreements and pinned known gaps are reported and do not fail —
      # see the module docstring in tools/oracle/run.py.
      - name: Run the corpus against RDKit and OpenBabel
        run: docker run --rm chem-oracle

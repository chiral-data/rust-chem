name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  changelog:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog for this tag
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md

  build-binaries:
    name: Build chem-app (${{ matrix.os }})
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: chem-app-linux-x86_64.tar.gz
          - os: macos-latest
            asset_name: chem-app-macos-x86_64.tar.gz
          - os: windows-latest
            asset_name: chem-app-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chem-app (release)
        run: cargo build --release -p chem-app

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset_name }} -C target/release chem-app

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/chem-app.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" ${{ matrix.asset_name }} --clobber

  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # One invocation, every crate. Cargo 1.83+ resolves the internal
      # dependency order itself and stages the unpublished crates in a
      # temporary local registry, so a dependent can be verified against a
      # dependency that is not on crates.io yet.
      #
      # That is not a tidiness change. Publishing them one at a time cannot
      # verify anything but the first: `cargo publish -p chem-io` fails with
      # "no matching package named chem-core" until chem-core is actually
      # live, so the sequential form this replaces was publishing six crates
      # entirely unverified, and hoping.
      #
      # chem-app is a GUI binary and is not published; it ships as a release
      # asset above. The `chem` facade joins this list in #144.
      #
      # `secrets` isn't a valid context for a job-level `if`, so the
      # not-configured-yet skip has to happen inside the step instead.
      - name: Publish crates (skips if CARGO_REGISTRY_TOKEN isn't set)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set - skipping crates.io publish (add the secret to enable)"
            exit 0
          fi
          cargo publish \
            -p chem-core -p chem-io -p chem-gpu -p chem-draw \
            -p chem-fp -p chem-search -p chem-cli

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  changelog:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog for this tag
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md

  build-binaries:
    name: Build chem-app (${{ matrix.os }})
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: chem-app-linux-x86_64.tar.gz
          - os: macos-latest
            asset_name: chem-app-macos-x86_64.tar.gz
          - os: windows-latest
            asset_name: chem-app-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chem-app (release)
        run: cargo build --release -p chem-app

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset_name }} -C target/release chem-app

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/chem-app.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" ${{ matrix.asset_name }} --clobber

  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # One crate, so there is no ordering problem and no inter-crate version
      # sync. `--locked` publishes exactly what CI verified.
      #
      # chem-app is a GUI binary carrying `publish = false`; it ships as a
      # release asset above. `--all-features` so the published package is
      # verified with `gpu` and `cli` compiled, not just the default surface.
      #
      # `secrets` isn't a valid context for a job-level `if`, so the
      # not-configured-yet skip has to happen inside the step instead.
      - name: Publish chem (skips if CARGO_REGISTRY_TOKEN isn't set)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set - skipping crates.io publish (add the secret to enable)"
            exit 0
          fi
          cargo publish -p chem --locked --all-features

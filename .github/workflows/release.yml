name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  changelog:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog for this tag
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md

  build-binaries:
    name: Build chem_app (${{ matrix.os }})
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: chem_app-linux-x86_64.tar.gz
          - os: macos-latest
            asset_name: chem_app-macos-x86_64.tar.gz
          - os: windows-latest
            asset_name: chem_app-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chem_app (release)
        run: cargo build --release -p chem_app

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset_name }} -C target/release chem_app

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/chem_app.exe -DestinationPath ${{ matrix.asset_name }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" ${{ matrix.asset_name }} --clobber

  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Publish order follows the internal dependency graph: chemcore has no
      # internal deps; chemgpu/chemio depend only on chemcore; chemfp depends
      # on all three. chem_app is a GUI binary, not published as a library.
      - name: Publish chemcore
        run: cargo publish -p chemcore --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 20

      - name: Publish chemgpu
        run: cargo publish -p chemgpu --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish chemio
        run: cargo publish -p chemio --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 20

      - name: Publish chemfp
        run: cargo publish -p chemfp --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
